---
# Groups configuration variables
ad_groups:
  # IT Department Groups
  - name: "IT-Admins"
    description: "IT Administrators with full domain access"
    scope: "global"
    category: "security"
    path: "OU=Security Groups,OU=Groups,{{ domain_dn }}"
    members:
      - "itadmin1"
      - "itadmin2"

  - name: "IT-Users"
    description: "Standard IT department users"
    scope: "domainlocal"
    category: "security"
    path: "OU=Security Groups,OU=Groups,{{ domain_dn }}"
    members:
      - "ituser1"
      - "ituser2"

  - name: "Helpdesk"
