---
# Domain configuration variables
ad_ou_structure:
  # GROUPS
  - name: "Groups"
    path: "{{ domain_dn }}"
    description: "Top-level container for all groups"
  - name: "Security Groups"
    path: "OU=Groups,{{ domain_dn }}"
    description: "Groups used for permissions (e.g., SG-FileAccess, SG-Admin)"
  - name: "Distribution Groups"
    path: "OU=Groups,{{ domain_dn }}"
    description: "Groups for email distribution (e.g., DG-SalesTeam)"
  - name: "Nested Groups"
    path: "OU=Groups,{{ domain_dn }}"
    description: "For role-based access control (RBAC) hierarchies"

  # SERVERS
  - name: "Servers"
    path: "{{ domain_dn }}"
    description: "For member servers (file servers, web servers, etc.)"
  - name: "FileServers"
    path: "OU=Servers,{{ domain_dn }}"
    description: "File/print servers"
  - name: "WebServers"
    path: "OU=Servers,{{    domain_dn }}"
    description: "Web servers (IIS, Apache, etc.)"
  - name: "DatabaseServers"
    path: "OU=Servers,{{ domain_dn }}"
    description: "SQL, MySQL, or other database servers"
  - name: "BackupServers"
    path: "OU=Servers,{{ domain_dn }}"
    description: "Backup servers (Veeam, Windows Backup, etc.)"
  - name: "Virtualization"
    path: "OU=Servers,{{ domain_dn }}"
    description: "Hyper-V, VMware, or other virtualization hosts"

  # WORKSTATIONS
  - name: "Workstations"
    path: "{{ domain_dn }}"
    description: "For client computers (desktops, laptops)"
  - name: "Sales"
    path: "OU=Workstations,{{ domain_dn }}"
    description: "Workstations used by the Sales team"
  - name: "Engineering"
    path: "OU=Workstations,{{ domain_dn }}"
    description: "Workstations used by engineers/developers"
  - name: "Finance"
    path: "OU=Workstations,{{ domain_dn }}"
    description: "Workstations used by Finance"
  - name: "Remote"
    path: "OU=Workstations,{{ domain_dn }}"
    description: "Workstations for remote employees"
  - name: "Kiosk"
    path: "OU=Workstations,{{ domain_dn }}"
    description: "Public/shared workstations (e.g., in lobbies)"

  # SERVICE ACCOUNTS
  - name: "Service Accounts"
    path: "{{ domain_dn }}"
    description: "For service accounts (e.g., SQL, IIS, scheduled tasks)"
  - name: "SQL"
    path: "OU=Service Accounts,{{ domain_dn }}"
    description: "Service accounts for SQL Server"
  - name: "IIS"
    path: "OU=Service Accounts,{{ domain_dn }}"
    description: "Service accounts for IIS/ASP.NET apps"
  - name: "Scheduled Tasks"
    path: "OU=Service Accounts,{{ domain_dn }}"
    description: "Accounts for automated tasks (e.g., backups, scripts)"
  - name: "ThirdParty"
    path: "OU=Service Accounts,{{ domain_dn }}"
    description: "Accounts for external vendors (e.g., backup software)"

  # PRINTERS
  - name: "Printers"
    path: "{{ domain_dn }}"
    description: "For printer objects (if managing printers via AD)"

  # GPOs
  - name: "GPOs"
    path: "{{ domain_dn }}"
    description: "For linking Group Policy Objects (optional, but useful for delegation)"
  - name: "Workstation Policies"
    path: "OU=GPOs,{{ domain_dn }}"
    description: "GPOs for workstation settings (e.g., password policies, screen lock)"
  - name: "Server Policies"
    path: "OU=GPOs,{{ domain_dn }}"
    description: "GPOs for server configurations (e.g., firewall rules, audit policies)"
  - name: "User Policies"
    path: "OU=GPOs,{{ domain_dn }}"
    description: "GPOs for user-specific settings (e.g., mapped drives, software restrictions)"

  # UserAccounts
  - name: "UserAccounts"
    path: "{{ domain_dn }}"
    description: "For user accounts (employees, contractors, admins)"
  - name: "Employees"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Regular employees"
  - name: "Contractors"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Temporary or external staff"
  - name: "Administrators"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Domain admins, server admins, etc."
  - name: "Service Desk"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Helpdesk/support staff"
  - name: "IT"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "IT department UserAccounts"
  - name: "HR"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Human Resources UserAccounts"
  - name: "Finance"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Finance department UserAccounts"
  - name: "Sales"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Sales team UserAccounts"
  - name: "Marketing"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Marketing team UserAccounts"
  - name: "Engineering"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Engineering team UserAccounts"
  - name: "Operations"
    path: "OU=UserAccounts,{{ domain_dn }}"
    description: "Operations team UserAccounts"
